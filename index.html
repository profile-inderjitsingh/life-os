<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover, user-scalable=no"
    />
    <title>Life OS</title>
    <meta name="description" content="Private habits, tasks and journal. Everything stays on your device." />
    <link rel="apple-touch-icon" href="/life-os/apple-touch-icon.png" />
    <link rel="icon" href="/life-os/icon.svg" type="image/svg+xml" />
    <link rel="manifest" href="/life-os/manifest.webmanifest" />
    <!-- iOS standalone / PWA -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Life OS" />
    <meta name="format-detection" content="telephone=no" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="icon" href="/icon.svg" type="image/svg+xml" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#F2F2F7" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#000000" />

    <script>
      // Paint the correct background before React boots, so there is no white flash on iOS.
      (function () {
        try {
          var saved = localStorage.getItem('life-os:theme') || 'system';
          var dark =
            saved === 'dark' ||
            (saved === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches);
          document.documentElement.classList.toggle('dark', dark);
          document.documentElement.style.backgroundColor = dark ? '#000000' : '#F2F2F7';
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
